[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kelana-ai"
version = "0.1.0"
description = "KelanaAI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy",
    "psycopg2-binary",
    "boto3",
    "python-jose",
    "passlib[bcrypt]",
    "pydantic"
]
[tool.fastapi]
entrypoint = "main:app"